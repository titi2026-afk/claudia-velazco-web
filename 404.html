<meta charset="utf-8">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Hanken Grotesk",system-ui,sans-serif;background:#0C2749;color:#fff;min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem}
  img{height:44px;margin:0 auto 2rem;background:#fff;padding:.6rem .9rem}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:500;font-size:clamp(2.2rem,6vw,3.4rem);margin-bottom:1rem}
  p{color:rgba(255,255,255,.78);margin-bottom:2rem;max-width:44ch}
  a{display:inline-block;font-size:.85rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:1rem 2rem;background:#DC1C2E;color:#fff}
</style>
</head>
<body>
<div>
  <img src="/Logos/remax-eleva.webp" alt="RE/MAX Eleva">
  <h1>Página no encontrada</h1>
  <p>La página que buscas no existe o cambió de dirección. Volvamos a un lugar conocido.</p>
  <a href="/">Ir al inicio</a>
</div>
<!-- bicultura-tracking v1 -->
<script>
/* Tracking de leads · Bicultura Lab. Dispara a GA4 los eventos de contacto.
   No requiere GTM: usa gtag si esta, y si no empuja al dataLayer. */
(function () {
  function fire(name, params) {
    try {
      if (typeof window.gtag === 'function') { window.gtag('event', name, params || {}); return; }
      window.dataLayer = window.dataLayer || [];
      var p = {}; for (var k in (params || {})) p[k] = params[k];
      p.event = name; window.dataLayer.push(p);
    } catch (err) { /* nunca romper la pagina por un evento */ }
  }

  /* clics de contacto */
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    var href = (a.getAttribute('href') || '').trim();
    if (!href) return;
    var d = { link_url: href, link_text: (a.textContent || '').trim().slice(0, 80), page_path: location.pathname };
      if (/wa\.me|api\.whatsapp|whatsapp\.com/i.test(href)) { fire('click_whatsapp', d); return; }
      if (/^tel:/i.test(href)) { fire('click_phone', d); return; }
      if (/^mailto:/i.test(href)) { fire('click_email', d); return; }
      if (/calendly|cal\.com|acuity|appointment|agendar|reservar/i.test(href)) { fire('click_booking', d); return; }
  }, true);

  /* envio de formulario */
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (!f || f.tagName !== 'FORM') return;
    var d = {
      form_id: f.id || '',
      form_name: f.getAttribute('name') || '',
      form_action: f.getAttribute('action') || '',
      page_path: location.pathname
    };
    fire('form_submit', d);
    fire('generate_lead', { source: 'website_form', form_id: d.form_id });
  }, true);

  /* formularios que envian por fetch/ajax: llamar biculturaLead('nombre') al terminar */
  window.biculturaLead = function (where) {
    fire('form_submit', { form_id: where || 'ajax', page_path: location.pathname });
    fire('generate_lead', { source: where || 'ajax' });
  };

  /* pagina de gracias = conversion confirmada */
  if (/gracias|thank-?you|thanks|success|confirmacion/i.test(location.pathname)) {
    fire('generate_lead', { source: 'thank_you_page', page_path: location.pathname });
  }
})();
</script>
<!-- /bicultura-tracking -->
</body>
